name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (x86_64)
        run: cargo build -p shrt --release --target=x86_64-pc-windows-msvc --locked
      - uses: actions/upload-artifact@v4
        with:
          name: shrt-x86_64
          path: target/x86_64-pc-windows-msvc/release/shrt.exe

  build-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (aarch64)
        run: cargo build -p shrt --release --target=aarch64-pc-windows-msvc --locked
      - uses: actions/upload-artifact@v4
        with:
          name: shrt-aarch64
          path: target/aarch64-pc-windows-msvc/release/shrt.exe

  release:
    runs-on: ubuntu-latest
    needs: [build-x64, build-arm64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shrt-x86_64
          path: dist/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: shrt-aarch64
          path: dist/aarch64
      - name: Rename and checksum
        run: |
          mkdir -p release
          cp dist/x86_64/shrt.exe "release/shrt-${{ github.ref_name }}-x86_64-pc-windows-msvc.exe"
          cp dist/aarch64/shrt.exe "release/shrt-${{ github.ref_name }}-aarch64-pc-windows-msvc.exe"
          (cd release && sha256sum *.exe > sha256sums.txt)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Automated release for ${{ github.ref_name }}" \
            release/*

  publish-crates:
    runs-on: windows-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish shrt-runner
        run: cargo publish -p shrt-runner --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Bundle runner sources into shrt
        shell: pwsh
        run: pwsh scripts/bundle-runner-src.ps1
      - name: cargo publish shrt
        run: cargo publish -p shrt --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  update-scoop:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PatrickRuddiman/PersonalScoopBucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      - name: Generate manifest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          BASE_URL="https://github.com/PatrickRuddiman/shrt/releases/download/${REF_NAME}"

          curl -sLO "${BASE_URL}/sha256sums.txt"
          X64_HASH=$(grep 'x86_64' sha256sums.txt | awk '{print $1}')
          ARM_HASH=$(grep 'aarch64' sha256sums.txt | awk '{print $1}')

          mkdir -p bucket
          cat > bucket/shrt.json <<JSON
          {
            "version": "${VERSION}",
            "description": "Parameterized command shortcuts for Windows.",
            "homepage": "https://github.com/PatrickRuddiman/shrt",
            "license": "MIT OR Apache-2.0",
            "architecture": {
              "64bit": {
                "url": "${BASE_URL}/shrt-${REF_NAME}-x86_64-pc-windows-msvc.exe#/shrt.exe",
                "hash": "${X64_HASH}"
              },
              "arm64": {
                "url": "${BASE_URL}/shrt-${REF_NAME}-aarch64-pc-windows-msvc.exe#/shrt.exe",
                "hash": "${ARM_HASH}"
              }
            },
            "bin": "shrt.exe",
            "post_install": "Write-Host 'Run \`shrt init\` to set up the shim directory.'"
          }
          JSON
      - name: Commit and push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/shrt.json
          git commit -m "Update shrt to ${REF_NAME}"
          git push
