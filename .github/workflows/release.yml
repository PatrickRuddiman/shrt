name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (x86_64)
        run: cargo build -p shrt --release --target=x86_64-pc-windows-msvc --locked
      - uses: actions/upload-artifact@v4
        with:
          name: shrt-x86_64
          path: target/x86_64-pc-windows-msvc/release/shrt.exe

  build-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (aarch64)
        run: cargo build -p shrt --release --target=aarch64-pc-windows-msvc --locked
      - uses: actions/upload-artifact@v4
        with:
          name: shrt-aarch64
          path: target/aarch64-pc-windows-msvc/release/shrt.exe

  release:
    runs-on: ubuntu-latest
    needs: [build-x64, build-arm64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shrt-x86_64
          path: dist/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: shrt-aarch64
          path: dist/aarch64
      - name: Rename and checksum
        run: |
          mkdir -p release
          cp dist/x86_64/shrt.exe "release/shrt-${{ github.ref_name }}-x86_64-pc-windows-msvc.exe"
          cp dist/aarch64/shrt.exe "release/shrt-${{ github.ref_name }}-aarch64-pc-windows-msvc.exe"
          (cd release && sha256sum *.exe > sha256sums.txt)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Automated release for ${{ github.ref_name }}" \
            release/*
